# DAS2-AI deployment
# ===========================================================================
#   docker compose up -d --build
#
# runs the analysis ONCE and stops. That is deliberate for now, by your
# request: "lets for now set it not to run on interval ... we just run each
# time we deploy and up it". The `das2` container starts, analyses the window,
# sends the map and the report, and exits 0 -- `docker compose logs das2`
# shows exactly what it did. To run it again, `docker compose up das2` again.
#
# To turn the hourly loop back on, one line: change the `das2` service's
# command from "run" to "schedule" and its restart policy back to
# `unless-stopped`. Nothing else changes -- the schedule command is still
# there and still tested.
#
# Services:
#
#   das2         one analysis, then exits
#   das2-ack     long-running: consumes the Telegram acknowledge buttons
#
# and one-shot helpers you run by hand:
#
#   docker compose run --rm das2-migrate     create the tables
#   docker compose run --rm das2-check       pre-flight
#
# Run `das2-check` FIRST. The three things most likely to be wrong on a new
# deployment -- the CSV path, the database credentials and the bot token -- all
# fail in ways that look identical to "the system found nothing wrong", and
# telling a healthy quiet network apart from a broken silent job is otherwise
# surprisingly hard.
#
# Everything is configured through .env. Copy .env.example and fill it in;
# no secret belongs in this file or in the image.

x-common: &common
  build: .
  image: das2-ai:latest
  env_file: [.env]
  restart: unless-stopped
  volumes:
    # The historian's export, mounted straight off the CIFS share and READ
    # ONLY -- `ro` in the mount options AND `:ro` here. This system has no
    # business writing to the share it reads from, and saying so twice makes it
    # structural rather than a promise.
    - hist_history:/data/input/HISTORY:ro
    - hist_histcurr:/data/input/HISTCURR:ro
    # LongLat.csv is NOT on the share -- it is a one-off export, not an hourly
    # one -- so it comes from a local folder. Without it there is no map, no
    # geo-clustering and no "by region" view, which is most of what this system
    # was built for, so it is mounted explicitly rather than hidden inside the
    # data directory.
    - ${DAS2_CONFIG_DIR:-./config}:/data/config:ro
    # Dashboards and PNGs. Mounted out so they survive a container rebuild and
    # can be served by whatever already serves files on your network.
    - ${DAS2_OUTPUT_DIR:-./output}:/data/output
    - ${DAS2_LOG_DIR:-./logs}:/data/logs
  environment:
    # Paths INSIDE the container. These point at the read-only mounts above;
    # change the volume definitions at the bottom of this file, not these.
    DAS2_INGEST_HISTORY_DIR: /data/input/HISTORY
    # The DIRECTORY, not a file. The share exports an hourly snapshot named
    # hts_HISTCURR_2026Sep22-130000, and the newest is always the one to read;
    # this used to name the old pipeline's single pre-merged
    # histcurr_fujitsu.csv, which has never existed on the real share.
    DAS2_INGEST_HISTCURR_PATH: /data/input/HISTCURR
    DAS2_INGEST_LONGLAT_PATH: /data/config/LongLat.csv
    DAS2_REPORT_OUTPUT_DIR: /data/output
  logging:
    # Without this, a container running for months fills the disk with logs and
    # takes the analysis down with it.
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  # --- one analysis, per `up` ----------------------------------------------
  # `restart: "no"` is not incidental: the common block above says
  # `unless-stopped`, which would restart this container the instant it exited
  # successfully and turn "run once" into a hot loop hammering the share.
  das2:
    <<: *common
    container_name: das2
    restart: "no"
    command: ["python", "-m", "das2.cli", "run"]

  # --- acknowledge worker --------------------------------------------------
  # Long-polls Telegram for button presses and records them. Separate from the
  # analysis loop so a slow or failing run never stops an operator from
  # acknowledging an alert, and so restarting one does not interrupt the other.
  #
  # Exactly ONE of these may run per bot token. Telegram hands each update to a
  # single getUpdates caller, so a second instance would silently steal half
  # the button presses -- do not scale this service.
  das2-ack:
    <<: *common
    container_name: das2-ack
    command: ["python", "-m", "das2.cli", "ack-worker"]

  # --- one-shot: create the tables ----------------------------------------
  # Idempotent, so running it again after an upgrade is the correct thing to do.
  das2-migrate:
    <<: *common
    container_name: das2-migrate
    restart: "no"
    command: ["python", "-m", "das2.cli", "migrate"]
    profiles: ["tools"]

  # --- one-shot: pre-flight ------------------------------------------------
  das2-check:
    <<: *common
    container_name: das2-check
    restart: "no"
    command: ["python", "-m", "das2.cli", "check"]
    profiles: ["tools"]

  # --- daily: baselines, DRIFT and NOISE_BURST -----------------------------
  # Schedule this ONCE A DAY from cron or Task Scheduler:
  #     docker compose run --rm das2-profile
  #
  # Not optional. DRIFT, NOISE_BURST and the whole L2 baseline layer depend on
  # it, and until it has run they produce nothing at all. It is separate from
  # the hourly loop because these answers change slowly, cost far more to
  # compute, and genuinely cannot be derived from a 72-hour window -- a 1%/day
  # drift is 3% across it while the daily demand cycle is 10-30%.
  das2-profile:
    <<: *common
    container_name: das2-profile
    restart: "no"
    command: ["python", "-m", "das2.cli", "profile"]
    profiles: ["tools"]

  # --- the hourly loop, when you want it back ------------------------------
  # Kept as its own service rather than as a comment, so turning the interval
  # back on is `docker compose --profile loop up -d das2-loop` rather than an
  # edit to this file that has to be remembered and reviewed.
  #
  # Do not run this AND `das2` together: two analyses of the same window would
  # both write incidents and both alert.
  das2-loop:
    <<: *common
    container_name: das2-loop
    command: ["python", "-m", "das2.cli", "schedule"]
    profiles: ["loop"]

  # --- one-shot: a single run, touching nothing ----------------------------
  # Writes a dashboard and prints what it found, without a database write or a
  # Telegram message. This is how to try the system against real data before
  # letting it talk to anyone.
  das2-dryrun:
    <<: *common
    container_name: das2-dryrun
    restart: "no"
    command: ["python", "-m", "das2.cli", "run", "--dry-run"]
    profiles: ["tools"]


# ===========================================================================
# CIFS volumes: the historian's export on \\<host>\dds_share
# ===========================================================================
# Mounted by the Docker daemon, not by the container, so the host needs
# `cifs-utils` installed but the container needs nothing.
#
# Credentials come from .env as DAS_VM_USERNAME / DAS_VM_PASSWORD and the host
# from DAS_MSSQL_HOST -- the same names the previous deployment used, so the
# existing .env values carry over unchanged.
#
# TWO THINGS WORTH KNOWING
#
# 1. The password ends up in the volume definition, which means
#    `docker volume inspect hist_history` prints it. That is how CIFS volumes
#    work in compose; if it matters, use a credentials file instead:
#        o: "credentials=/etc/das2-cifs.cred,vers=3.0,ro,..."
#    with the file readable only by root on the host.
#
# 2. This image runs as a NON-ROOT user (uid 10001), which the previous one may
#    not have. `noperm` plus 0777 modes should make that a non-issue, but if
#    reads fail with "Permission denied", add `uid=10001,gid=10001` to the
#    options below -- that is the fix, not chmod on the share.
#
# HISTALMEVT is deliberately NOT mounted. The SCADA alarm feed is out of scope
# by your own decision ("old scada alarm events are useless and no value in
# this new detection"), and nothing in das2/ reads it. Mounting a share the
# code never opens would only be one more thing to break at 3 a.m. Uncomment
# the block at the end if that decision changes.
volumes:
  hist_history:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${DAS_VM_USERNAME},password=${DAS_VM_PASSWORD},vers=3.0,ro,noperm,file_mode=0777,dir_mode=0777"
      device: "//${DAS_MSSQL_HOST}/dds_share/HISTORY"

  hist_histcurr:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${DAS_VM_USERNAME},password=${DAS_VM_PASSWORD},vers=3.0,ro,noperm,file_mode=0777,dir_mode=0777"
      device: "//${DAS_MSSQL_HOST}/dds_share/HISTCURR"

  # Only needed if SCADA alarms come back into scope. Add
  #     - hist_histalmevt:/data/input/HISTALMEVT:ro
  # to the volumes list above as well if you enable it.
  #
  # hist_histalmevt:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     o: "username=${DAS_VM_USERNAME},password=${DAS_VM_PASSWORD},vers=3.0,ro,noperm,file_mode=0777,dir_mode=0777"
  #     device: "//${DAS_MSSQL_HOST}/dds_share/HISTALMEVT"
